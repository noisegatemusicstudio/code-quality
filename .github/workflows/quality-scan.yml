# Reusable ReleaseReady quality scan. Callers pin `code-quality-ref` to a full
# commit SHA. See README "Quality scan workflow".
name: Quality scan

on:
  workflow_call:
    inputs:
      enforce:
        description: Fail the job on failed/incomplete engines or findings at or above fail-on-severity. Default is advisory.
        type: boolean
        default: false
      node-version:
        type: string
        default: 22.23.4
      scanners:
        description: 'Comma list of eslint, prettier, gitleaks, osv, trivy, semgrep, jscpd, ruff, mypy, pmd, checkstyle, spotbugs, detekt, ktlint, swiftlint, swiftlint-analyze, shellcheck, shfmt, actionlint, zizmor, hadolint, tflint, yamllint, markdownlint, or all (applicable engines only).'
        type: string
        default: all
      code-quality-ref:
        description: Full 40-character commit SHA of noisegatemusicstudio/code-quality to run.
        type: string
        required: true
      fail-on-severity:
        description: 'Enforce threshold: info, low, medium, high or critical.'
        type: string
        default: high
      osv-mode:
        description: 'online (default; package names, versions and ecosystems are sent to the OSV API), offline (not provisioned, OSV is skipped) or off.'
        type: string
        default: online
      baseline-path:
        description: Optional repo-relative path of a previous report.json for the new-vs-baseline split.
        type: string
        default: ''
      base-ref:
        description: 'Baseline ref for new-code measures on pushes (pull requests use their base SHA). Empty: new-code measures are unknown on pushes.'
        type: string
        default: ''
      coverage-report:
        description: 'Optional repo-relative path of an Istanbul coverage-final.json produced by the caller; the scan never runs tests. Empty: coverage is unknown.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CQ_REF: ${{ inputs.code-quality-ref }}
      CQ_SCANNERS: ${{ inputs.scanners }}
      CQ_ENFORCE: ${{ inputs.enforce }}
      CQ_FAIL_ON: ${{ inputs.fail-on-severity }}
      CQ_BASELINE: ${{ inputs.baseline-path }}
      CQ_OSV_MODE: ${{ inputs.osv-mode }}
      CQ_BASE_REF: ${{ inputs.base-ref }}
      CQ_COVERAGE: ${{ inputs.coverage-report }}
    steps:
      - name: Require a full-SHA code-quality-ref
        run: |
          if ! [[ "$CQ_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "code-quality-ref must be a full 40-character commit SHA" >&2
            exit 2
          fi
      - name: Check out the commit under test
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # Full history: the committed-snapshot scanners reject shallow repositories.
          fetch-depth: 0
      - name: Check out the scanner tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: noisegatemusicstudio/code-quality
          ref: ${{ inputs.code-quality-ref }}
          path: .quality-tool
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node-version }}
      # Shared by every JVM engine (Java: PMD, Checkstyle). The scan resolves
      # `java` from JAVA_HOME (src/java-runtime.ts); add JVM engines here, not a second JDK step.
      - name: Set up JDK for JVM engines
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the scanner tooling
        working-directory: .quality-tool
        run: |
          npm ci --ignore-scripts
          npm run build
      # detekt and ktlint are JVM jars. ubuntu-latest ships Temurin (JAVA_HOME);
      # the scan finds it itself and reports the Kotlin engines `skipped` with a
      # reason when no runtime exists, so no third-party action is needed.
      # SwiftLint is the official static Linux binary (no Swift toolchain, no
      # macOS runner). `--repo` makes the install download it only when the
      # checkout has tracked .swift files, so other repositories pay nothing.
      - name: Install pinned engines (sha256-verified)
        run: node .quality-tool/dist/src/quality-scan-cli.js install --dir "$RUNNER_TEMP/engines" --scanners "$CQ_SCANNERS" --repo "$GITHUB_WORKSPACE"
      - name: Install pinned Semgrep (hash-locked)
        id: semgrep
        run: |
          list=",$(printf '%s' "$CQ_SCANNERS" | tr 'A-Z ' 'a-z'),"
          case "$list" in *,semgrep,*|*,all,*|,,) ;; *) exit 0 ;; esac
          if python3 -m venv "$RUNNER_TEMP/semgrep" \
            && "$RUNNER_TEMP/semgrep/bin/pip" install --quiet --require-hashes --only-binary=:all: --no-deps \
              -r .quality-tool/scanners/semgrep-requirements.txt; then
            echo "bin=$RUNNER_TEMP/semgrep/bin/semgrep" >> "$GITHUB_OUTPUT"
          else
            echo "error=hash-locked semgrep install failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned yamllint (hash-locked)
        id: yamllint
        run: |
          list=",$(printf '%s' "$CQ_SCANNERS" | tr 'A-Z ' 'a-z'),"
          case "$list" in *,yamllint,*|*,all,*|,,) ;; *) exit 0 ;; esac
          if python3 -m venv "$RUNNER_TEMP/yamllint" \
            && "$RUNNER_TEMP/yamllint/bin/pip" install --quiet --require-hashes --only-binary=:all: --no-deps \
              -r .quality-tool/scanners/yamllint-requirements.txt; then
            echo "bin=$RUNNER_TEMP/yamllint/bin/yamllint" >> "$GITHUB_OUTPUT"
          else
            echo "error=hash-locked yamllint install failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Run scans
        run: |
          args=(run --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/quality-scan"
            --tools-dir "$RUNNER_TEMP/engines" --scanners "$CQ_SCANNERS"
            --enforce "$CQ_ENFORCE" --fail-on-severity "$CQ_FAIL_ON"
            --rules "$GITHUB_WORKSPACE/.quality-tool/rules/semgrep"
            --osv-mode "$CQ_OSV_MODE" --code-quality-ref "$CQ_REF")
          if [ -n "$SEMGREP_BIN" ]; then args+=(--semgrep "$SEMGREP_BIN"); fi
          if [ -n "$SEMGREP_ERROR" ]; then args+=(--semgrep-error "$SEMGREP_ERROR"); fi
          if [ -n "$YAMLLINT_BIN" ]; then args+=(--yamllint "$YAMLLINT_BIN"); fi
          if [ -n "$YAMLLINT_ERROR" ]; then args+=(--yamllint-error "$YAMLLINT_ERROR"); fi
          # markdownlint-cli2 comes from the package-lock.json (integrity-checked) install above.
          args+=(--markdownlint-cli2 "$GITHUB_WORKSPACE/.quality-tool/node_modules/markdownlint-cli2/markdownlint-cli2-bin.mjs")
          if [ -n "$CQ_BASELINE" ]; then args+=(--baseline "$CQ_BASELINE"); fi
          if [ -n "$CQ_BASE_REF" ]; then args+=(--base-ref "$CQ_BASE_REF"); fi
          if [ -n "$CQ_COVERAGE" ]; then args+=(--coverage "$GITHUB_WORKSPACE/$CQ_COVERAGE"); fi
          node .quality-tool/dist/src/quality-scan-cli.js "${args[@]}"
        env:
          SEMGREP_BIN: ${{ steps.semgrep.outputs.bin }}
          SEMGREP_ERROR: ${{ steps.semgrep.outputs.error }}
          YAMLLINT_BIN: ${{ steps.yamllint.outputs.bin }}
          YAMLLINT_ERROR: ${{ steps.yamllint.outputs.error }}
      - name: Upload report and envelopes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-quality-results
          path: ${{ runner.temp }}/quality-scan
          retention-days: 90
          if-no-files-found: warn
