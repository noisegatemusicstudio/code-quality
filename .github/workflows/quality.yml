name: Quality

# Owner-approved exception to the hosted-CI pause (Jira RRDPLAT-24): the quality
# scan runs on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    # Dogfood: advisory mode, scanner tooling built from the commit under test.
    uses: ./.github/workflows/quality-scan.yml
    with:
      code-quality-ref: ${{ github.sha }}
      enforce: false
