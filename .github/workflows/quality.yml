name: Quality

# Owner-approved exception to the hosted-CI pause (Jira RRDPLAT-24): the quality
# scan runs on main and on demand only. It is advisory (enforce: false), so it does not run on pull requests
# (RRDPLAT-114, Actions budget).
# Formerly: It no longer runs on every branch push: a push to a PR branch started a
# second scan next to the pull_request one, and drafts are skipped (RRDPLAT-114, Actions budget).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read # private @buildproveship/config devDependency of the scanner tooling

jobs:
  quality:
    # Dogfood: advisory mode, scanner tooling built from the commit under test.
    uses: ./.github/workflows/quality-scan.yml
    with:
      code-quality-ref: ${{ github.sha }}
      enforce: false
