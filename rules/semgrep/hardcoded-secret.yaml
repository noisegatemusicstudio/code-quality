# ReleaseReady-authored Semgrep rule (RRDSCRUM-133). Written from scratch; not
# copied or derived from the Semgrep Registry or any other third-party rule set.
# Ruleset version: 2026.11.1
rules:
  - id: releaseready.js.hardcoded-secret
    languages: [javascript, typescript]
    severity: WARNING
    message: A secret-looking name is assigned a long literal value. Review whether a real credential is committed.
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VALUE"
          - pattern: const $NAME = "$VALUE"
          - pattern: let $NAME = "$VALUE"
          - pattern: '{..., $NAME: "$VALUE", ...}'
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(password|passwd|secret|api_?key|access_?token|private_?key).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^[A-Za-z0-9+/=_-]{16,}$
    metadata:
      category: security
      cwe: 'CWE-798: Use of Hard-coded Credentials'
      confidence: MEDIUM
      finding-type: hotspot
      remediation: 'Read the value from a secret store or environment at run time and rotate any exposed credential.'
      author: ReleaseReady
      license: 'Proprietary, all rights reserved (ReleaseReady-authored)'
      version: '1'
      ruleset-version: '2026.11.1'
