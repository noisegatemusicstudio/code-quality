# ReleaseReady-authored Semgrep rule (RRDSCRUM-133). Written from scratch; not
# copied or derived from the Semgrep Registry or any other third-party rule set.
# Ruleset version: 2026.11.1
rules:
  - id: releaseready.js.tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate verification is disabled with rejectUnauthorized false.
    pattern-either:
      - pattern: '{..., rejectUnauthorized: false, ...}'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
    metadata:
      category: security
      cwe: 'CWE-295: Improper Certificate Validation'
      confidence: HIGH
      finding-type: vulnerability
      remediation: 'Remove the override and trust the correct CA through the platform or a pinned CA bundle.'
      author: ReleaseReady
      license: 'Proprietary, all rights reserved (ReleaseReady-authored)'
      version: '1'
      ruleset-version: '2026.11.1'
